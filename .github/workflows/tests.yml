name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: energydisplay

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: energydisplay/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
