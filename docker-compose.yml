services:
  energydisplay:
    image: ghcr.io/hawkinslabdev/ha_energydisplay:latest
    build: .
    env_file: .env
    ports:
      - "9123:9123"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
